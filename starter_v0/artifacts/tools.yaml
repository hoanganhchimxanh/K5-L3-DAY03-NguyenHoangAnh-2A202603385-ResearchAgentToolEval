# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.

tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user one concise question when essential information is missing
      and cannot be safely inferred from conversation context.
      Use when clarification is necessary before selecting or executing a tool.
      Do NOT use when the request is already clear, when context provides the
      missing information, or when the request is outside the supported scope.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "One concise question requesting essential missing information."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected answer format."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice."}
      required: [question]

  - name: timeline
    description: >
      Retrieve recent posts from a specific social media account.
      Use when the user requests recent tweets/posts from an identified account.
      Resolve a person's name to their known public account handle when reliable.
      Preserve the requested post count across conversation turns.
      Do NOT use for general keyword searches, news searches, or when the account
      cannot be reliably identified. Ask for clarification instead of guessing.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without the @ prefix, e.g. elonmusk (not @elonmusk). Map a person's name only when the public handle is reliable; otherwise clarify."}
        limit: {type: integer, default: 5, description: "Number of recent posts requested. Preserve the user's explicit count; default to 5 only when unspecified."}
      required: [screenname]

  - name: social_search
    description: >
      Search social media posts by keyword, phrase, topic, or hashtag.
      Use when the user wants to discover posts across accounts rather than
      retrieve posts from one specific account.
      Use Latest for newest posts and Top for popular or most relevant posts.
      Do NOT use for general web research, scientific papers, or a specific
      account timeline.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Social media search keywords, topic, phrase, or hashtag."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Use exactly Latest for newest/recent posts or Top for popular/top posts. Preserve the user's preference; default to Latest when unspecified."}
        limit: {type: integer, default: 5, description: "Maximum number of posts. Preserve the requested count; default to 5."}
      required: [query]

  - name: lookup
    description: >
      Search the general internet for information or news.
      Use topic=news for current events, announcements, and news articles.
      Use topic=general for explanations, background information, and general
      research. Select timeframe according to the user's requested period.
      Use day for the last 24 hours, week for the last 7 days,
      month for the last 30 days, and year for the last 365 days.
      Do NOT use for social media post searches, scientific paper searches,
      internal policies, or retrieving the contents of a known URL.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Subject or keywords to search (e.g. AI). Keep news intent out of the query; set topic=news instead. Do not invent a missing subject."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use exactly news for current news/events and general for background research. Do not put 'news' in the query just to indicate news intent."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Use day=last 24 hours, week=last 7 days, month=last 30 days, year=last 365 days. Preserve the user's explicit time period; default to week if unspecified."}
        max_results: {type: integer, default: 5, description: "Maximum number of search results."}
      required: [query]

  - name: fetch
    description: >
      Retrieve and extract content from a specific URL provided by the user
      or obtained from a previous search result.
      Use when the user asks to read, inspect, or summarize a known webpage.
      Do NOT invent URLs or use this tool for discovering unknown sources.
      Use lookup to discover sources first when necessary.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "A valid, explicitly provided or previously retrieved URL."}
      required: [url]

  - name: format
    description: >
      Transform already collected research results into a structured text output.
      Use after relevant information has been retrieved through research tools
      or when the user provides the data directly.
      Choose the template that best matches the requested output.
      Do NOT use to search for information, invent facts, or fabricate sources.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Previously retrieved or user-provided information. Preserve source URLs and factual accuracy."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "brief = concise summary; sections = organized sections; bullets = bullet list; thread = social media thread; daily_ai_vn = Vietnamese AI news digest."}
        headline: {type: string, default: "", description: "Optional title for the formatted output."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Send a prepared text message through the configured messaging channel.
      Call this tool ONLY after the user explicitly confirms sending the exact
      content or clearly approves the immediately preceding send proposal, and
      set confirmed=true. Never call it with confirmed=false or before approval.
      Preparing, drafting, editing, or previewing a message does NOT authorize
      sending it. A request to write or draft a message is not confirmation.
      A request to send, post, or publish is not itself confirmation.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact message content the user explicitly approved; do not send a different or subsequently edited message without reconfirmation."}
        confirmed: {type: boolean, default: false, description: "Set true only after explicit user approval of this exact content. Otherwise do not call send; ask for confirmation with clarify."}
      required: [text]

  - name: policy
    description: >
      Search internal policy documents about research, citations, privacy,
      external publishing, and tool usage.
      Use when the user asks about organizational rules or internal procedures.
      Do NOT use for general internet searches or scientific literature searches.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Question or keywords to search in internal policy documents."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Relevant internal policy category. Use all if the category is unclear."}
        top_k: {type: integer, default: 3, description: "Maximum number of relevant policy sections."}
      required: [query]

  - name: papers
    description: >
      Search academic and scientific papers, including arXiv publications.
      Use for literature reviews, scientific research, and requests for academic
      references. Preserve explicit result limits and sorting preferences.
      Do NOT use for general web news, social media posts, or internal policies.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Academic topic, research question, keywords, or paper title."}
        max_results: {type: integer, default: 5, description: "Maximum number of academic papers to return."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "relevance = best topic match; lastUpdatedDate = recently updated; submittedDate = recently submitted."}
      required: [query]

  - name: paper_text
    description: >
      Retrieve extracted text from a specific academic paper.
      Use when the user wants to read, inspect, or analyze a paper identified
      by an arXiv ID or a paper URL.
      Do NOT use to discover papers from a general research topic; use papers first.
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "An arXiv ID such as 1706.03762 or a valid paper URL."}
        max_pages: {type: integer, default: 5, description: "Maximum number of paper pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum extracted text length in characters."}
      required: [arxiv_url]

  - name: citation_audit
    description: >
      Check collected research items for a non-empty title and a valid HTTP(S)
      source URL, then format complete entries as citations.
      Use when the user asks to check or format citations from information
      already provided or retrieved.
      Do NOT use to search for sources, assess source credibility, or verify
      whether a source supports a claim.
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Collected research items to check. Each item should include a title and URL; source is optional."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
      required: [items]

  - name: save_markdown
    description: >
      Save an answer or document as a downloadable Markdown file in the local
      exports folder without overwriting existing files.
      Use ONLY when the user explicitly asks to export or download the answer
      as a .md/Markdown file. Save the complete final answer content, not a
      placeholder or summary. Do NOT use for ordinary chat replies or save
      automatically when the user did not ask for a file.
    parameters:
      type: object
      properties:
        content: {type: string, description: "The complete answer/document in Markdown, ready to download."}
        filename: {type: string, default: "research-answer", description: "Short descriptive filename; extension is optional. Unsafe characters and paths are removed automatically."}
      required: [content]
